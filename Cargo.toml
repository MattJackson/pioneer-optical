# Self-contained manifest (no workspace inheritance) so it packages for crates.io as-is.
[package]
name = "pioneer-optical"
version = "0.8.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["Matthew Jackson <1085847+MattJackson@users.noreply.github.com>"]
description = "Pioneer optical drive (BD/DVD) vendor protocol: command encoding, response decoding, update and memory-read sequences over any SCSI transport, and firmware image analysis. no_std."
repository = "https://github.com/MattJackson/pioneer-optical"
homepage = "https://github.com/MattJackson/pioneer-optical"
documentation = "https://docs.rs/pioneer-optical"
readme = "README.md"
keywords = ["pioneer", "optical", "scsi", "firmware", "bluray"]
categories = ["hardware-support", "no-std::no-alloc"]

[lib]
name = "pioneer_optical"

[features]
# Command sequences over a caller-supplied transport. no_std, no alloc.
drive = []
# Firmware image analysis. Uses alloc and a zlib inflater.
image = ["dep:miniz_oxide"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
miniz_oxide = { version = "0.8", optional = true, default-features = false, features = ["with-alloc"] }
