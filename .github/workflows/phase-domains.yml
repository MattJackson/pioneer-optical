name: Phase-only corpus coverage
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'tests/phase_domain_coverage.rs'
      - 'tests/phase_sat1_phase_only.rs'
      - 'tests/startup_pair_profiles.rs'
      - 'tests/startup_generation_integrity.rs'
      - 'tests/startup_inspection.rs'
      - 'tests/fixtures/phase-domain-inventory.json'
      - 'tests/fixtures/phase-sat1-deferred-calls.json'
      - 'tests/fixtures/phase-conditional-receivers.json'
      - 'tests/fixtures/phase-unavailable-receivers.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/phase-corpus.json'
      - '.github/scripts/fetch-phase-corpus.py'
      - '.github/workflows/phase-domains.yml'
permissions:
  contents: read
concurrency:
  group: phase-domains-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          rows = [{"domain": domain, "shard": shard, "shards": shards}
                  for domain, shards in [("sat1", 2), ("h8sat", 8)]
                  for shard in range(shards)]
          print("value=" + json.dumps({"include": rows}))
          PY
  phase:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Draft inputs require repository push access. The token is exposed only
    # to the download step; it is not persisted by checkout or passed to tests.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: phase-domain
          cache-on-failure: true
      - name: Fetch exact unpublished original-image inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/fetch-phase-corpus.py
          --config .github/phase-corpus.json
          --manifest tests/fixtures/phase-domain-inventory.json
          --conditional-manifest tests/fixtures/phase-conditional-receivers.json
          --domain '${{ matrix.domain }}'
          --output "$RUNNER_TEMP/phase-inputs"
      - name: Validate the pinned inventory
        id: inventory
        run: cargo test --locked --release --features envelope --test phase_domain_coverage -- --skip every_target_mapping_and_ordered_planner_pair
      - name: Prove the unsigned-capture authentication boundary
        if: ${{ !cancelled() && steps.inventory.outcome == 'success' && matrix.domain == 'h8sat' && matrix.shard == 0 }}
        env:
          PIONEER_PHASE_CORPUS: ${{ runner.temp }}/phase-inputs
        shell: bash
        run: |
          cargo test --locked --release --features envelope --test phase_domain_coverage \
            unsigned_packaged_phase_output_uses_existing_authenticated_encoder \
            -- --ignored --exact --nocapture 2>&1 | tee "$RUNNER_TEMP/phase-authentication-report.txt"
      - name: Prove target mappings and every ordered planner pair
        if: ${{ !cancelled() && steps.inventory.outcome == 'success' }}
        env:
          PIONEER_PHASE_CORPUS: ${{ runner.temp }}/phase-inputs
          PIONEER_PHASE_DOMAIN: ${{ matrix.domain }}
          PIONEER_PHASE_SHARD: ${{ matrix.shard }}
          PIONEER_PHASE_SHARDS: ${{ matrix.shards }}
        shell: bash
        run: |
          echo "source=${{ github.sha }} domain=${{ matrix.domain }} shard=${{ matrix.shard }}/${{ matrix.shards }}" > "$RUNNER_TEMP/phase-report.txt"
          cargo test --locked --release --features envelope --test phase_domain_coverage \
            every_target_mapping_and_ordered_planner_pair \
            -- --ignored --exact --nocapture 2>&1 | tee -a "$RUNNER_TEMP/phase-report.txt"
      - name: Prove exact paired Startup profiles and composition
        if: ${{ !cancelled() && steps.inventory.outcome == 'success' && matrix.domain == 'h8sat' && matrix.shard == 0 }}
        env:
          PIONEER_PHASE_CORPUS: ${{ runner.temp }}/phase-inputs
          PIONEER_CORPUS: ${{ runner.temp }}/phase-inputs
          PIONEER_NORMAL_CORPUS: ${{ runner.temp }}/phase-inputs
        shell: bash
        run: |
          cargo test --locked --release --features envelope --lib \
            authenticated_bdr211m_boundary_positive_mutations_and_phase_preservation -- --ignored --nocapture
          cargo test --locked --release --features envelope --lib \
            authenticated_sat8000_pairs_bind_and_reject_native_mutations -- --ignored --nocapture
          cargo test --locked --release --features envelope --test startup_pair_profiles \
            bdr211m_pair_profile_composes_without_editing_firmware_or_parameters -- --ignored --exact --nocapture
          cargo test --locked --release --features envelope --test startup_pair_profiles \
            sat8000_pair_profile_retains_resident_validation_without_edits -- --ignored --exact --nocapture
          cargo test --locked --release --features envelope --test startup_generation_integrity \
            exact_w1_generation_checks_survive_authentication_and_full_composition -- --ignored --exact --nocapture
      - name: Prove exact paired SAT1 legacy preservation contracts
        if: ${{ !cancelled() && steps.inventory.outcome == 'success' && matrix.domain == 'sat1' && matrix.shard == 0 }}
        env:
          PIONEER_PHASE_CORPUS: ${{ runner.temp }}/phase-inputs
        shell: bash
        run: |
          cargo test --locked --release --features envelope --lib \
            startup::coverage::legacy_sinks::tests:: \
            -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/sat1-legacy-report.txt"
          cargo test --locked --release --features envelope --test startup_pair_profiles \
            sat1_pair_profile_composes_phase_without_persistent_edits \
            -- --ignored --exact --nocapture 2>&1 | tee -a "$RUNNER_TEMP/sat1-legacy-report.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-${{ matrix.domain }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/phase-report.txt
            ${{ runner.temp }}/phase-authentication-report.txt
            ${{ runner.temp }}/sat1-legacy-report.txt
          if-no-files-found: ignore
          retention-days: 14
