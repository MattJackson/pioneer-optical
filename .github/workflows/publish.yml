name: Publish
on:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the exact version on crates.io
        id: gate
        shell: bash
        run: |
          name=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["name"])')
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          code=$(curl --silent --show-error --location \
            --output "$RUNNER_TEMP/registry-version.json" --write-out '%{http_code}' \
            --user-agent "$name-publish-ci" "https://crates.io/api/v1/crates/$name/$version")
          case "$code" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Registry lookup failed: HTTP $code" >&2; exit 1 ;;
          esac
      - name: Require identical QA-validated package inputs
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --unshallow || git fetch --all
          python3 .github/scripts/verify-source.py --branch qa
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.publish == 'true'
      - name: Publish verified package
        if: steps.gate.outputs.publish == 'true'
        run: cargo publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
